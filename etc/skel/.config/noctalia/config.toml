[accessibility]
ui_scale = 0.95000000670552254

[bar.default]
capsule = true
center = [ "workspaces" ]
reserve_space = false
smart_auto_hide = true
start = [ "clock" ]

[dock]
background_opacity = 0.39999999105930328
enabled = true
icon_size = 38
launcher_icon = "deer"
launcher_position = "start"
magnification_scale = 1.2500000037252903
reserve_space = false
shadow = false
show_dots = true
show_instance_count = false
smart_auto_hide = true

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 720.0
    cy = 718.0
    output = "HDMI-A-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
font_family = "Adwaita Sans"
lang = "pt-BR"
polkit_agent = true
screen_time_enabled = true

    [shell.launcher]
    fetch_exchange_rates = false
    sort_by_usage = false

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true
    open_near_click_wallpaper = true
    polkit_placement = "attached"

    [shell.screenshot]
    directory = "~/Imagens/Capturas de Tela"

[theme]
source = "wallpaper"
wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "niri", "qt" ]

[wallpaper]
directory = "~/Imagens/Papéis de Parede"

    [wallpaper.default]
    path = "/home/user/Imagens/Papéis de Parede/pytuna-default.jpg"

    [wallpaper.last]
    path = "/home/user/Imagens/Papéis de Parede/pytuna-default.jpg"

    [wallpaper.monitors.HDMI-A-2]
    path = "/home/user/Imagens/Papéis de Parede/pytuna-default.jpg"

    [[wallpaper.favorite]]
    builtin_palette = "Noctalia"
    palette_source = "builtin"
    path = "/home/user/Imagens/Papéis de Parede/pytuna-default.jpg"
    theme_mode = "dark"

[widget.battery]
color = "#669844"

[widget.bluetooth]
color = "#52A5BD"

[widget.clipboard]
color = "#F09B66"

[widget.clock]
color = "#FFFFFF"

[widget.control-center]
color = "#8360AB"

[widget.media]
art_size = 96
color = "primary"
max_length = 328
title_scroll = "on_hover"

[widget.network]
color = "#52A5BD"

[widget.notifications]
color = "hover"
hide_when_no_unread = true

[widget.session]
color = "#FF0017"

[widget.volume]
color = "primary"
show_label = false
